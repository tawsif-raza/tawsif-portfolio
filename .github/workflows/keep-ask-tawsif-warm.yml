# Keeps the Ask Tawsif chat server (Render free tier) awake so visitors don't wait out a cold start.
# Render's free server sleeps after 15 idle minutes; a ping every 10 minutes keeps it up.
#
# Only runs 03:00-19:00 UTC (08:30-00:30 IST, covering the Europe workday and the US morning), about
# 500 hours a month. That stays well inside Render's 750 free hours per workspace, which are shared by
# every free service you have there. Outside that window the site's own wake-on-load ping still helps.
#
# Notes: GitHub runs scheduled workflows only from the default branch (main), sometimes a few minutes
# late, and turns them off after 60 days without a commit to the repo. A failed run emails you,
# which doubles as a "chat server is down" alert.
name: Keep Ask Tawsif warm

on:
  schedule:
    - cron: "*/10 3-18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://ask-tawsif.onrender.com/health
